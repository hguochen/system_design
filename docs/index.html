<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Design Study Hub</title>
<style>
  :root {
    --bg: #f9f8f6;
    --surface: #ffffff;
    --surface-alt: #f3f2ef;
    --border: #e5e3de;
    --text: #1a1917;
    --text-muted: #6b6861;
    --text-faint: #a09d97;
    --accent: #2563eb;
    --accent-light: #dbeafe;
    --accent-hover: #1d4ed8;
    --green: #16a34a;
    --green-light: #dcfce7;
    --sidebar-w: 268px;
    font-size: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  a { color: inherit; text-decoration: none; }
  button { cursor: pointer; font-family: inherit; }

  /* ─────────────────────────────────────────
     TOP BAR (reader view only)
  ───────────────────────────────────────── */
  #topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 52px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    z-index: 200;
  }

  #topbar-hamburger {
    display: none;
    background: none;
    border: none;
    padding: 6px;
    border-radius: 6px;
    color: var(--text-muted);
    line-height: 1;
  }
  #topbar-hamburger:hover { background: var(--surface-alt); }
  #topbar-hamburger svg { display: block; }

  #topbar-back {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
    font-size: 14px;
    font-weight: 500;
    padding: 4px 8px;
    border-radius: 6px;
    border: none;
    background: none;
  }
  #topbar-back:hover { background: var(--accent-light); }

  #topbar-breadcrumb {
    font-size: 14px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #topbar-breadcrumb strong { color: var(--text); }

  /* ─────────────────────────────────────────
     READER LAYOUT
  ───────────────────────────────────────── */
  #reader-view {
    display: none;
    padding-top: 52px; /* topbar height */
  }

  /* ── SIDEBAR ── */
  #sidebar {
    position: fixed;
    top: 52px; left: 0; bottom: 0;
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    z-index: 100;
    padding-bottom: 32px;
  }

  #sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 99;
  }

  .nav-phase {
    padding: 16px 16px 4px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    user-select: none;
  }
  .nav-phase:not(:first-child) { margin-top: 8px; }

  .nav-topic {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
  }
  .nav-topic:hover { color: var(--text); }
  .nav-topic .toggle {
    margin-left: auto;
    font-size: 10px;
    transition: transform 0.15s;
    color: var(--text-faint);
  }
  .nav-topic.open .toggle { transform: rotate(90deg); }

  .nav-subtopics { overflow: hidden; }
  .nav-subtopics.collapsed { display: none; }

  .nav-subtopic {
    display: block;
    padding: 5px 16px 5px 36px;
    font-size: 13px;
    color: var(--text-muted);
    border-left: 2px solid transparent;
    cursor: pointer;
    transition: background 0.1s;
    line-height: 1.4;
  }
  .nav-subtopic:hover { background: var(--surface-alt); color: var(--text); }
  .nav-subtopic.active {
    background: var(--accent-light);
    color: var(--accent);
    border-left-color: var(--accent);
    font-weight: 500;
  }
  .nav-subtopic.no-file {
    color: var(--text-faint);
    cursor: default;
    pointer-events: none;
  }
  .nav-subtopic .badge-done {
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--green);
    border-radius: 50%;
    margin-left: 6px;
    vertical-align: middle;
    flex-shrink: 0;
  }

  /* ── CONTENT ── */
  #content {
    margin-left: var(--sidebar-w);
    min-height: calc(100vh - 52px);
  }

  #topic-frame {
    display: block;
    width: 100%;
    border: none;
    overflow: hidden;
  }

  /* ─────────────────────────────────────────
     HOME VIEW
  ───────────────────────────────────────── */
  #home-view {
    max-width: 1100px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  .home-header {
    text-align: center;
    margin-bottom: 48px;
  }
  .home-header h1 {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  .home-header p {
    color: var(--text-muted);
    font-size: 15px;
  }
  .home-header .progress-summary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    padding: 8px 16px;
    background: var(--green-light);
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    color: var(--green);
  }

  .phase-section { margin-bottom: 40px; }

  .phase-heading {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .topic-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  .topic-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .topic-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.07); border-color: #ccc; }

  .topic-card-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 12px;
  }
  .topic-card-emoji { font-size: 20px; line-height: 1; margin-top: 2px; flex-shrink: 0; }
  .topic-card-title { font-size: 14px; font-weight: 700; line-height: 1.4; }
  .topic-card-num { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .subtopic-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .subtopic-pill {
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 99px;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.1s;
    border: 1px solid transparent;
  }
  .subtopic-pill.has-file {
    background: var(--accent-light);
    color: var(--accent);
    border-color: #bfdbfe;
  }
  .subtopic-pill.has-file:hover { background: #bfdbfe; }
  .subtopic-pill.no-file {
    background: var(--surface-alt);
    color: var(--text-faint);
    cursor: default;
  }
  .subtopic-pill.done {
    background: var(--green-light);
    color: var(--green);
    border-color: #86efac;
  }
  .subtopic-pill.done:hover { background: #bbf7d0; }

  /* ─────────────────────────────────────────
     RESPONSIVE — MOBILE
  ───────────────────────────────────────── */
  @media (max-width: 767px) {
    #topbar-hamburger { display: flex; align-items: center; justify-content: center; }

    #sidebar {
      transform: translateX(-100%);
      transition: transform 0.22s ease;
      top: 52px;
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar-overlay.open { display: block; }

    #content { margin-left: 0; }

    #home-view { padding: 28px 16px 60px; }
    .home-header h1 { font-size: 1.5rem; }
    .topic-cards { grid-template-columns: 1fr; }
  }
  .tier-pill { display:inline-block; font-size:9px; font-weight:800; letter-spacing:.04em; padding:1px 4px; border-radius:3px; margin-right:6px; vertical-align:1px; }
  .tier-t1 { background:#fef3c7; color:#b45309; }
  .tier-t2 { background:#dbeafe; color:#1d4ed8; }
  .tier-t3 { background:#f3f2ef; color:#8a867e; }
  .tier-none { background:transparent; color:#c9c5bd; border:1px dashed #ddd9d1; }

  /* ── design-problem tags ───────────────────────────── */
  .prob-pill { display:inline-block; font-size:9px; font-weight:700; padding:1px 4px;
               border-radius:3px; margin-left:4px; vertical-align:1px; white-space:nowrap;
               border:1px solid transparent; }
  .prob-a { background:#ecfdf5; color:#047857; border-color:#a7f3d0; }
  .prob-b { background:#f5f3ff; color:#6d28d9; border-color:#ddd6fe; }
  .prob-c { background:#fafaf9; color:#a8a29e; border-color:#e7e5e4; }
  .nav-subtopic .prob-pill { font-size:8px; padding:0 3px; }

  /* ── filter bar ────────────────────────────────────── */
  .filter-bar { display:flex; flex-wrap:wrap; gap:6px; align-items:center;
                margin:14px 0 22px; padding:10px 12px; background:var(--surface,#faf9f7);
                border:1px solid #e7e5e4; border-radius:8px; }
  .filter-label { font-size:11px; font-weight:700; color:var(--text-muted,#8a867e);
                  text-transform:uppercase; letter-spacing:.05em; margin-right:2px; }
  .filter-btn { font-size:11px; font-weight:600; padding:3px 9px; border-radius:12px;
                border:1px solid #e7e5e4; background:#fff; color:#57534e; cursor:pointer;
                transition:all .12s; }
  .filter-btn:hover { border-color:#d6d3d1; background:#fafaf9; }
  .filter-btn.active { background:#1c1917; color:#fff; border-color:#1c1917; }
  .filter-btn.dim { opacity:.4; }
  .filter-count { font-size:11px; color:var(--text-muted,#8a867e); margin-left:auto; }
  .topic-card.filtered-out { display:none; }
  .subtopic-pill.filtered-out { opacity:.15; }

  /* tier accent on home-view pills — left edge encodes T1/T2/T3 */
  .subtopic-pill { border-left:3px solid transparent; }
  .subtopic-pill.pt-t1 { border-left-color:#f59e0b; }
  .subtopic-pill.pt-t2 { border-left-color:#3b82f6; }
  .subtopic-pill.pt-t3 { border-left-color:#d6d3d1; }
  .subtopic-pill.pt-none { border-left-style:dotted; border-left-color:#e7e5e4; }

  .tier-legend { display:flex; flex-wrap:wrap; gap:12px; align-items:center;
                 margin:-8px 0 20px; font-size:11px; color:var(--text-muted,#8a867e); }
  .tier-legend b { font-weight:700; color:#57534e; }
  .legend-swatch { display:inline-block; width:9px; height:9px; border-radius:2px;
                   margin-right:4px; vertical-align:-1px; }
</style>
</head>

</div>

<!-- ═══════════════════════════════════════════
     APP LOGIC
════════════════════════════════════════════ -->
<script>
(function () {
  // ── DOM refs ──────────────────────────────
  const homeView     = document.getElementById('home-view');
  const readerView   = document.getElementById('reader-view');
  const topbar       = document.getElementById('topbar');
  const hamburger    = document.getElementById('topbar-hamburger');
  const backBtn      = document.getElementById('topbar-back');
  const breadcrumb   = document.getElementById('topbar-breadcrumb');
  const sidebarEl    = document.getElementById('sidebar');
  const overlay      = document.getElementById('sidebar-overlay');
  const contentEl    = document.getElementById('content');
  const frame        = document.getElementById('topic-frame');
  const phaseList    = document.getElementById('phase-list');
  const progressEl   = document.getElementById('progress-summary');

  let activeSubtopicId = null;
  let openTopicNums = new Set();

  // ── DESIGN PROBLEMS REGISTRY ─────────────
  // Sourced from design_problems/NN_*.md coverage docs.
  const PROBLEMS = {
    '1': { name: 'URL Shortener',  short: 'P1' },
    '2': { name: 'Rate Limiter',   short: 'P2' },
  };
  const PROB_TIER_NAME = { A: 'Spine', B: 'Differentiator', C: 'Awareness' };
  let activeFilter = null;   // e.g. '1' → show only Problem 1 coverage

  const parseProb = p => ({ n: p.slice(0, -1), t: p.slice(-1) });

  function tierBadgeHTML(sub) {
    if (!sub.tier) return `<span class="tier-pill tier-none" title="Not yet tiered in the roadmap">—</span>`;
    return `<span class="tier-pill tier-${sub.tier.toLowerCase()}">${sub.tier}</span>`;
  }

  function probPillsHTML(sub) {
    if (!sub.probs || !sub.probs.length) return '';
    return sub.probs.map(p => {
      const { n, t } = parseProb(p);
      const meta = PROBLEMS[n];
      if (!meta) return '';
      return `<span class="prob-pill prob-${t.toLowerCase()}" title="${meta.name} — Tier ${t} (${PROB_TIER_NAME[t]})">${meta.short}${t}</span>`;
    }).join('');
  }

  function subTitle(sub) {
    const parts = [sub.label];
    if (sub.tier) parts.push(`Tier ${sub.tier}`);
    if (sub.probs) sub.probs.forEach(p => {
      const { n, t } = parseProb(p);
      if (PROBLEMS[n]) parts.push(`${PROBLEMS[n].name}: Tier ${t}`);
    });
    return parts.join('  •  ');
  }

  const matchesFilter = sub =>
    !activeFilter || (sub.probs || []).some(p => parseProb(p).n === activeFilter);

  // ── PROGRESS SUMMARY ─────────────────────
  function calcProgress() {
    let total = 0, done = 0, hasFile = 0;
    PHASES.forEach(ph => ph.topics.forEach(t => t.subtopics.forEach(s => {
      total++;
      if (s.done) done++;
      if (s.file) hasFile++;
    })));
    return { total, done, hasFile };
  }

  // ── FILTER BAR ───────────────────────────
  function buildFilterBar() {
    const bar = document.createElement('div');
    bar.className = 'filter-bar';

    const lbl = document.createElement('span');
    lbl.className = 'filter-label';
    lbl.textContent = 'Design problem';
    bar.appendChild(lbl);

    const mk = (key, text, titleText) => {
      const b = document.createElement('button');
      b.className = 'filter-btn' + (activeFilter === key ? ' active' : '');
      b.textContent = text;
      b.title = titleText;
      b.addEventListener('click', () => { activeFilter = key; buildHome(); });
      bar.appendChild(b);
    };

    mk(null, 'All', 'Show every subtopic');
    Object.entries(PROBLEMS).forEach(([n, meta]) =>
      mk(n, `${meta.short} · ${meta.name}`, `Show only subtopics in the ${meta.name} coverage map`));

    const all = PHASES.flatMap(p => p.topics).flatMap(t => t.subtopics);
    const count = document.createElement('span');
    count.className = 'filter-count';
    if (activeFilter) {
      const m = all.filter(matchesFilter);
      const byTier = t => m.filter(s => (s.probs || []).some(p => p === activeFilter + t)).length;
      count.textContent = `${m.length} subtopics · ${byTier('A')} spine / ${byTier('B')} depth / ${byTier('C')} awareness · ${m.filter(s => s.done).length} done`;
    } else {
      count.textContent = `${all.filter(s => s.probs).length} of ${all.length} mapped to a design problem`;
    }
    bar.appendChild(count);
    return bar;
  }

  // ── TIER LEGEND ──────────────────────────
  function buildTierLegend() {
    const all = PHASES.flatMap(p => p.topics).flatMap(t => t.subtopics);
    const n = k => all.filter(s => (s.tier || 'none').toLowerCase() === k).length;
    const el = document.createElement('div');
    el.className = 'tier-legend';
    el.innerHTML = `
      <span><span class="legend-swatch" style="background:#f59e0b"></span><b>T1</b> Core · ~3h · ${n('t1')}</span>
      <span><span class="legend-swatch" style="background:#3b82f6"></span><b>T2</b> Depth · ~1.75h · ${n('t2')}</span>
      <span><span class="legend-swatch" style="background:#d6d3d1"></span><b>T3</b> Awareness · ~30m · ${n('t3')}</span>
      <span><span class="legend-swatch" style="background:#f5f5f4;border:1px dotted #d6d3d1"></span>untiered · ${n('none')}</span>
      <span style="margin-left:auto">
        <span class="prob-pill prob-a">P#A</span> spine
        <span class="prob-pill prob-b">P#B</span> differentiator
        <span class="prob-pill prob-c">P#C</span> awareness
      </span>`;
    return el;
  }

  // ── BUILD HOME VIEW ───────────────────────
  function buildHome() {
    const { total, done, hasFile } = calcProgress();
    progressEl.innerHTML = `✅ ${done} / ${total} subtopics completed &nbsp;·&nbsp; 📄 ${hasFile} notes available`;

    phaseList.innerHTML = '';
    phaseList.appendChild(buildFilterBar());
    phaseList.appendChild(buildTierLegend());

    PHASES.forEach(phase => {
      const section = document.createElement('div');
      section.className = 'phase-section';

      const heading = document.createElement('div');
      heading.className = 'phase-heading';
      heading.textContent = phase.label;
      section.appendChild(heading);

      const cards = document.createElement('div');
      cards.className = 'topic-cards';

      phase.topics.forEach(topic => {
        const card = document.createElement('div');
        card.className = 'topic-card';

        const header = document.createElement('div');
        header.className = 'topic-card-header';
        header.innerHTML = `
          <div class="topic-card-emoji">${topic.emoji}</div>
          <div>
            <div class="topic-card-title">${topic.label}</div>
            <div class="topic-card-num">Topic ${topic.num}</div>
          </div>`;
        card.appendChild(header);

        if (activeFilter && !topic.subtopics.some(matchesFilter)) card.classList.add('filtered-out');

        const pills = document.createElement('div');
        pills.className = 'subtopic-pills';
        topic.subtopics.forEach(sub => {
          const pill = document.createElement('span');
          pill.className = 'subtopic-pill'
            + ` pt-${sub.tier ? sub.tier.toLowerCase() : 'none'}`
            + (matchesFilter(sub) ? '' : ' filtered-out');
          pill.innerHTML = `${sub.id}${probPillsHTML(sub)}`;
          pill.title = subTitle(sub);

          if (sub.done && sub.file) {
            pill.classList.add('done');
            pill.addEventListener('click', () => openSubtopic(sub, topic, phase));
          } else if (sub.done) {
            pill.classList.add('done');
            pill.style.cursor = 'default';
          } else if (sub.file) {
            pill.classList.add('has-file');
            pill.addEventListener('click', () => openSubtopic(sub, topic, phase));
          } else {
            pill.classList.add('no-file');
          }

          pills.appendChild(pill);
        });
        card.appendChild(pills);
        cards.appendChild(card);
      });

      section.appendChild(cards);
      phaseList.appendChild(section);
    });
  }

  // ── BUILD SIDEBAR NAV ─────────────────────
  function buildSidebar(activeId) {
    sidebarEl.innerHTML = '';

    PHASES.forEach(phase => {
      const phaseHeader = document.createElement('div');
      phaseHeader.className = 'nav-phase';
      phaseHeader.textContent = phase.label;
      sidebarEl.appendChild(phaseHeader);

      phase.topics.forEach(topic => {
        // Topic header (collapsible)
        const topicEl = document.createElement('div');
        topicEl.className = 'nav-topic';
        const isOpen = openTopicNums.has(topic.num);
        if (isOpen) topicEl.classList.add('open');

        topicEl.innerHTML = `
          <span>${topic.emoji}</span>
          <span>${topic.num}. ${topic.label}</span>
          <span class="toggle">▶</span>`;

        const subtopicsEl = document.createElement('div');
        subtopicsEl.className = 'nav-subtopics' + (isOpen ? '' : ' collapsed');

        topicEl.addEventListener('click', () => {
          const nowOpen = !topicEl.classList.contains('open');
          topicEl.classList.toggle('open', nowOpen);
          subtopicsEl.classList.toggle('collapsed', !nowOpen);
          if (nowOpen) openTopicNums.add(topic.num);
          else openTopicNums.delete(topic.num);
        });

        sidebarEl.appendChild(topicEl);

        topic.subtopics.forEach(sub => {
          const subEl = document.createElement('div');
          subEl.className = 'nav-subtopic' + (sub.file ? '' : ' no-file');
          if (sub.id === activeId) subEl.classList.add('active');

          subEl.innerHTML = `${tierBadgeHTML(sub)}${sub.id} ${sub.label}${sub.done ? '<span class="badge-done"></span>' : ''}${probPillsHTML(sub)}`;
          subEl.title = subTitle(sub);

          if (sub.file) {
            subEl.addEventListener('click', () => {
              closeSidebarMobile();
              openSubtopic(sub, topic, phase);
            });
          }

          subtopicsEl.appendChild(subEl);
        });

        sidebarEl.appendChild(subtopicsEl);
      });
    });
  }

  // ── OPEN A SUBTOPIC ───────────────────────
  function openSubtopic(sub, topic, phase) {
    activeSubtopicId = sub.id;
    openTopicNums.add(topic.num);

    // Show reader view
    homeView.style.display = 'none';
    readerView.style.display = 'block';

    // Breadcrumb
    breadcrumb.innerHTML = `${phase.label} &rsaquo; T${topic.num} &rsaquo; <strong>${sub.id} ${sub.label}</strong>`;

    // Rebuild sidebar with current active
    buildSidebar(sub.id);

    // Scroll active nav item into view
    requestAnimationFrame(() => {
      const activeEl = sidebarEl.querySelector('.nav-subtopic.active');
      if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
    });

    // Load iframe
    frame.style.height = '600px'; // placeholder while loading
    frame.src = sub.file;

    frame.onload = () => {
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        const h = doc.documentElement.scrollHeight;
        frame.style.height = h + 'px';
      } catch (e) {
        frame.style.height = '100vh';
      }
    };

    // Scroll outer page to top
    window.scrollTo(0, 0);
  }

  // ── SHOW HOME ─────────────────────────────
  function showHome() {
    readerView.style.display = 'none';
    homeView.style.display = 'block';
    activeSubtopicId = null;
    window.scrollTo(0, 0);
  }

  // ── MOBILE SIDEBAR ───────────────────────
  hamburger.addEventListener('click', () => {
    sidebarEl.classList.toggle('open');
    overlay.classList.toggle('open');
  });
  overlay.addEventListener('click', closeSidebarMobile);

  function closeSidebarMobile() {
    sidebarEl.classList.remove('open');
    overlay.classList.remove('open');
  }

  // ── BACK BUTTON ───────────────────────────
  backBtn.addEventListener('click', showHome);

  // ── URL HASH ROUTING ─────────────────────
  // Support deep-linking: index.html#3.2
  function routeFromHash() {
    const hash = location.hash.replace('#', '').trim();
    if (!hash) return;
    for (const phase of PHASES) {
      for (const topic of phase.topics) {
        for (const sub of topic.subtopics) {
          if (sub.id === hash && sub.file) {
            openSubtopic(sub, topic, phase);
            return;
          }
        }
      }
    }
  }

  window.addEventListener('hashchange', routeFromHash);

  // ── INIT ─────────────────────────────────
  buildHome();

  // Auto-expand topics that have available files in sidebar on first open
  PHASES.forEach(phase => phase.topics.forEach(topic => {
    if (topic.subtopics.some(s => s.file)) openTopicNums.add(topic.num);
  }));

  routeFromHash();
})();
</script>
